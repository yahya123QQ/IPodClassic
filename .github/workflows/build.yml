          package com.ipod.classic;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.app.ActivityManager;
          import android.database.Cursor;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.media.AudioManager;
          import android.media.MediaMetadataRetriever;
          import android.media.MediaScannerConnection;
          import android.net.ConnectivityManager;
          import android.net.NetworkInfo;
          import android.net.wifi.WifiManager;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import java.io.BufferedInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import org.json.JSONArray;
          import org.json.JSONObject;

          /** JS <-> Java bridge, exposed to the page as window.A */
          public class Bridge {
              final Activity a;
              final WebView w;

              Bridge(Activity a, WebView w) { this.a = a; this.w = w; }

              void js(final String s) {
                  a.runOnUiThread(new Runnable() { public void run() { w.evaluateJavascript(s, null); } });
              }

              static String quote(String s) {
                  return JSONObject.quote(s).replace("\u2028", "\\u2028").replace("\u2029", "\\u2029");
              }

              static File musicDir() {
                  File dir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_MUSIC), "iPod");
                  dir.mkdirs();
                  return dir;
              }

              // ---------- local library ----------
              @JavascriptInterface public String library() {
                  JSONArray r = new JSONArray();
                  try {
                      Cursor c = a.getContentResolver().query(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI,
                          new String[]{"_data", "title", "artist", "album", "duration", "date_added"}, "duration>1000", null, "title COLLATE NOCASE");
                      if (c != null) {
                          while (c.moveToNext()) {
                              String p = c.getString(0);
                              if (p == null) continue;
                              String l = p.toLowerCase();
                              if (!(l.endsWith(".mp3") || l.endsWith(".m4a") || l.endsWith(".wav") || l.endsWith(".aac") || l.endsWith(".ogg") || l.endsWith(".flac"))) continue;
                              if (l.contains("/ringtones/") || l.contains("/notifications/") || l.contains("/alarms/")) continue;
                              JSONObject o = new JSONObject();
                              o.put("p", p).put("t", c.getString(1)).put("a", c.getString(2)).put("b", c.getString(3)).put("d", c.getLong(4) / 1000).put("da", c.getLong(5));
                              r.put(o);
                          }
                          c.close();
                      }
                  } catch (Exception e) {}
                  return r.toString();
              }

              @JavascriptInterface public String art(String p) {
                  if (p == null || p.startsWith("http") || p.startsWith("lazy:")) return "";
                  MediaMetadataRetriever m = new MediaMetadataRetriever();
                  try {
                      m.setDataSource(p);
                      byte[] b = m.getEmbeddedPicture();
                      if (b == null) {                       // downloaded songs keep their cover in a sibling .art file
                          File af = new File(p.replaceAll("\\.[^./]+$", "") + ".art");
                          if (!af.exists()) return "";
                          FileInputStream fi = new FileInputStream(af);
                          ByteArrayOutputStream bo = new ByteArrayOutputStream();
                          byte[] tb = new byte[8192]; int tn;
                          while ((tn = fi.read(tb)) > 0) bo.write(tb, 0, tn);
                          fi.close();
                          b = bo.toByteArray();
                      }
                      BitmapFactory.Options o = new BitmapFactory.Options();
                      o.inJustDecodeBounds = true;
                      BitmapFactory.decodeByteArray(b, 0, b.length, o);
                      o.inSampleSize = Math.max(1, o.outWidth / 200);
                      o.inJustDecodeBounds = false;
                      Bitmap bm = BitmapFactory.decodeByteArray(b, 0, b.length, o);
                      if (bm == null) return "";
                      ByteArrayOutputStream s = new ByteArrayOutputStream();
                      bm.compress(Bitmap.CompressFormat.JPEG, 70, s);
                      bm.recycle();
                      return "data:image/jpeg;base64," + Base64.encodeToString(s.toByteArray(), Base64.NO_WRAP);
                  } catch (Exception e) {
                      return "";
                  } finally {
                      try { m.release(); } catch (Exception e) {}
                  }
              }

              @JavascriptInterface public boolean del(String path) {       // only files this app downloaded
                  if (path == null || !path.contains("/Music/iPod/")) return false;
                  boolean ok = new File(path).delete();
                  if (ok) MediaScannerConnection.scanFile(a, new String[]{path}, null, null);
                  return ok;
              }

              // ---------- playback ----------
              @JavascriptInterface public void playQueue(String json, int start) {
                  try { Player.setQueue(a, new JSONArray(json), start); } catch (Exception e) {}
              }
              @JavascriptInterface public void toggle() { Player.toggle(); }
              @JavascriptInterface public void next() { Player.next(); }
              @JavascriptInterface public void prev() { Player.prev(); }
              @JavascriptInterface public void seek(int ms) { Player.seek(ms); }
              @JavascriptInterface public String state() { return Player.state(); }
              @JavascriptInterface public void setRepeat(int r) { Player.repeat = r; }
              @JavascriptInterface public void setShuffle(boolean b) { Player.shuffle = b; }

              @JavascriptInterface public void vol(int d) {
                  ((AudioManager) a.getSystemService(Context.AUDIO_SERVICE)).adjustStreamVolume(AudioManager.STREAM_MUSIC,
                      d > 0 ? AudioManager.ADJUST_RAISE : AudioManager.ADJUST_LOWER, 0);
              }
              @JavascriptInterface public String volume() {
                  AudioManager m = (AudioManager) a.getSystemService(Context.AUDIO_SERVICE);
                  return m.getStreamVolume(AudioManager.STREAM_MUSIC) + "," + m.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
              }

              // ---------- app / status ----------
              @JavascriptInterface public void hide() {
                  a.runOnUiThread(new Runnable() { public void run() { a.moveTaskToBack(true); } });
              }
              @JavascriptInterface public void exit() {       // stop music, hand the phone back to its normal launcher
                  Player.release();
                  stopServer();
                  a.runOnUiThread(new Runnable() {
                      public void run() {
                          try {
                              boolean ok = false;
                              Intent hm = new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME);
                              for (ResolveInfo r : a.getPackageManager().queryIntentActivities(hm, 0)) {
                                  if (!r.activityInfo.packageName.equals(a.getPackageName())) {
                                      a.startActivity(new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME)
                                          .setClassName(r.activityInfo.packageName, r.activityInfo.name).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));
                                      ok = true;
                                      break;
                                  }
                              }
                              if (!ok) a.startActivity(new Intent(android.provider.Settings.ACTION_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));
                          } catch (Exception e) {}
                          a.finish();
                      }
                  });
              }

              /** Battery saver: ends background processes of every user-installed app (system apps and keyboards are never touched). */
              @JavascriptInterface public void saveBattery() {
                  new Thread(new Runnable() { public void run() { int n = killBg(); js("toast('Closed " + n + " apps')"); } }).start();
              }

              int killBg() {
                  int n = 0;
                  try {
                      ActivityManager am = (ActivityManager) a.getSystemService(Context.ACTIVITY_SERVICE);
                      PackageManager pm = a.getPackageManager();
                      for (ApplicationInfo ai : pm.getInstalledApplications(0)) {
                          if (ai.packageName.equals(a.getPackageName())) continue;
                          if ((ai.flags & (ApplicationInfo.FLAG_SYSTEM | ApplicationInfo.FLAG_UPDATED_SYSTEM_APP)) != 0) continue;
                          String l = ai.packageName.toLowerCase();
                          if (l.contains("keyboard") || l.contains("inputmethod")) continue;
                          try { am.killBackgroundProcesses(ai.packageName); n++; } catch (Exception e) {}
                      }
                  } catch (Exception e) {}
                  return n;
              }

              @JavascriptInterface public String status() {
                  try {
                      Intent i = a.registerReceiver(null, new IntentFilter(Intent.ACTION_BATTERY_CHANGED));
                      int lv = i.getIntExtra("level", 0) * 100 / Math.max(1, i.getIntExtra("scale", 100));
                      boolean ch = i.getIntExtra("plugged", 0) != 0;
                      WifiManager wm = (WifiManager) a.getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                      NetworkInfo n = ((ConnectivityManager) a.getSystemService(Context.CONNECTIVITY_SERVICE)).getActiveNetworkInfo();
                      return "{\"b\":" + lv + ",\"c\":" + ch + ",\"w\":" + wm.isWifiEnabled() + ",\"n\":" + (n != null && n.isConnected()) + "}";
                  } catch (Exception e) {
                      return "{\"b\":0,\"c\":false,\"w\":false,\"n\":false}";
                  }
              }

              // ---------- network ----------
              @JavascriptInterface public void get(final String url, final int id) {
                  new Thread(new Runnable() {
                      public void run() {
                          try {
                              js("onHttp(" + id + ",true," + quote(Net.text(url)) + ")");
                          } catch (Exception e) {
                              js("onHttp(" + id + ",false,'')");
                          }
                      }
                  }).start();
              }

              @JavascriptInterface public void download(final String url, final String name, final int id, final String img, final String kind) {
                  new Thread(new Runnable() {
                      public void run() {
                          try {
                              File dir = musicDir();
                              if ("pod".equals(kind)) dir = new File(dir, "Podcasts");
                              else if ("quran".equals(kind)) dir = new File(dir, "Quran");
                              dir.mkdirs();
                              String base = name.replaceAll("[^\\p{L}\\p{N}\\-_ ]", "_");
                              if (base.length() > 80) base = base.substring(0, 80);
                              File f = new File(dir, base + ".mp3");
                              HttpURLConnection h = Net.open(url);
                              if (h.getResponseCode() >= 400) throw new IOException("HTTP");
                              int len = h.getContentLength();
                              InputStream in = h.getInputStream();
                              FileOutputStream o = new FileOutputStream(f);
                              byte[] b = new byte[16384]; int n, last = -1; long t = 0;
                              while ((n = in.read(b)) > 0) {
                                  o.write(b, 0, n); t += n;
                                  int p = len > 0 ? (int) (t * 100 / len) : 0;
                                  if (p != last && p % 10 == 0) { last = p; js("onDl(" + id + "," + p + ",'')"); }
                              }
                              o.close(); in.close();
                              if (img != null && img.startsWith("http")) {
                                  try {
                                      HttpURLConnection g = Net.open(img);
                                      InputStream gi = g.getInputStream();
                                      FileOutputStream go = new FileOutputStream(new File(dir, base + ".art"));
                                      byte[] gb = new byte[8192]; int gn;
                                      while ((gn = gi.read(gb)) > 0) go.write(gb, 0, gn);
                                      go.close(); gi.close();
                                  } catch (Exception e) {}
                              }
                              MediaScannerConnection.scanFile(a, new String[]{f.getPath()}, null, null);
                              js("onDl(" + id + ",101," + quote(f.getPath()) + ")");
                          } catch (Exception e) {
                              js("onDl(" + id + ",-1,'')");
                          }
                      }
                  }).start();
              }

              // ---------- sleep timer ----------
              static final Handler SH = new Handler(Looper.getMainLooper());
              static final Runnable SR = new Runnable() { public void run() { Player.pause(); } };
              @JavascriptInterface public void sleep(int min) {
                  SH.removeCallbacks(SR);
                  if (min > 0) SH.postDelayed(SR, min * 60000L);
              }

              // ---------- Wi-Fi upload server (runs only while the Upload screen is open) ----------
              static java.net.ServerSocket srv;

              @JavascriptInterface public synchronized String startServer() {
                  try {
                      int ip = ((WifiManager) a.getApplicationContext().getSystemService(Context.WIFI_SERVICE)).getConnectionInfo().getIpAddress();
                      if (ip == 0) return "";
                      stopServer();
                      final java.net.ServerSocket s = new java.net.ServerSocket(8080);
                      srv = s;
                      new Thread(new Runnable() {
                          public void run() {
                              while (!s.isClosed()) {
                                  try {
                                      final java.net.Socket c = s.accept();
                                      new Thread(new Runnable() { public void run() { serve(c); } }).start();
                                  } catch (Exception e) {}
                              }
                          }
                      }).start();
                      return "http://" + (ip & 255) + "." + ((ip >> 8) & 255) + "." + ((ip >> 16) & 255) + "." + ((ip >> 24) & 255) + ":8080";
                  } catch (Exception e) {
                      return "";
                  }
              }

              @JavascriptInterface public synchronized void stopServer() {
                  try { if (srv != null) srv.close(); } catch (Exception e) {}
                  srv = null;
              }

              static String line(InputStream in) throws IOException {
                  StringBuilder b = new StringBuilder();
                  int c;
                  while ((c = in.read()) != -1 && c != '\n') if (c != '\r') b.append((char) c);
                  return b.toString();
              }

              void serve(java.net.Socket s) {
                  try {
                      s.setSoTimeout(30000);
                      InputStream in = new BufferedInputStream(s.getInputStream());
                      OutputStream out = s.getOutputStream();
                      String rq = line(in), h;
                      long cl = 0;
                      while ((h = line(in)).length() > 0) if (h.toLowerCase().startsWith("content-length:")) cl = Long.parseLong(h.substring(15).trim());
                      String body;
                      if (rq.startsWith("POST /up?n=")) {
                          String n = java.net.URLDecoder.decode(rq.substring(11, rq.indexOf(' ', 11)), "UTF-8").replaceAll("[^\\p{L}\\p{N}\\-_. ()]", "_");
                          if (!n.toLowerCase().matches(".*\\.(mp3|m4a|aac|wav|ogg|flac)$")) {
                              body = "Not an audio file";
                          } else {
                              File f = new File(musicDir(), n);
                              FileOutputStream o = new FileOutputStream(f);
                              byte[] b = new byte[16384]; long t = 0; int r;
                              while (t < cl && (r = in.read(b, 0, (int) Math.min(b.length, cl - t))) > 0) { o.write(b, 0, r); t += r; }
                              o.close();
                              MediaScannerConnection.scanFile(a, new String[]{f.getPath()}, null, null);
                              body = "OK";
                          }
                      } else {
                          body = "<meta charset='utf-8'><meta name=viewport content='width=device-width'><body style='font-family:sans-serif;text-align:center;padding:30px'>"
                              + "<h2>iPod - \u0631\u0641\u0639 \u0627\u0644\u0623\u063a\u0627\u0646\u064a</h2><input type=file id=f multiple accept='audio/*'><p><button onclick='up()'>Upload</button></p><pre id=s></pre>"
                              + "<script>async function up(){var a=document.getElementById('f').files,s=document.getElementById('s');for(var i=0;i<a.length;i++){s.textContent+=a[i].name+' ... ';"
                              + "try{var r=await fetch('/up?n='+encodeURIComponent(a[i].name),{method:'POST',body:a[i]});s.textContent+=(await r.text())+'\\n'}catch(e){s.textContent+='ERR\\n'}}}</script>";
                      }
                      byte[] bb = body.getBytes("UTF-8");
                      out.write(("HTTP/1.1 200 OK\r\nContent-Type: text/html; charset=utf-8\r\nConnection: close\r\nContent-Length: " + bb.length + "\r\n\r\n").getBytes());
                      out.write(bb);
                      out.flush();
                      s.close();
                  } catch (Exception e) {
                      try { s.close(); } catch (Exception x) {}
                  }
              }
          }
          EOF_X

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Check APK
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
