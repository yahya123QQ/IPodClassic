Name: Build iPod Classic APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (platform 34, build-tools 34.0.0)
        run: |
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          set +o pipefail
          yes | "$SDKM" --licenses > /dev/null || true
          set -o pipefail
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Write settings.gradle
        run: |
          mkdir -p '.'
          cat > 'settings.gradle' <<'EOF_X'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "IPodClassic"
          include ':app'
          EOF_X

      - name: Write build.gradle
        run: |
          mkdir -p '.'
          cat > 'build.gradle' <<'EOF_X'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF_X

      - name: Write gradle.properties
        run: |
          mkdir -p '.'
          cat > 'gradle.properties' <<'EOF_X'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF_X

      - name: Write app/build.gradle
        run: |
          mkdir -p 'app'
          cat > 'app/build.gradle' <<'EOF_X'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.ipod.classic'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ipod.classic"
                  minSdk 21
                  targetSdk 28
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              buildTypes { release { minifyEnabled false } }
              lint { abortOnError false; checkReleaseBuilds false }
          }
          EOF_X

      - name: Write app/src/main/AndroidManifest.xml
        run: |
          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_X'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <application
                  android:label="iPod"
                  android:icon="@android:drawable/ic_media_play"
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:requestLegacyExternalStorage="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustPan"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".KeepAliveService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback"/>
              </application>
          </manifest>
          EOF_X

      - name: Write app/src/main/assets/index.html
        run: |
          mkdir -p 'app/src/main/assets'
          cat > 'app/src/main/assets/index.html' <<'EOF_X'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
          <title>iPod</title>
          <style>
          *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none}
          html,body{width:100%;height:100%;background:#0b0b0c;color:#eee;font-family:sans-serif;overflow:hidden}
          #ipod{position:absolute;box-shadow:0 6px 24px #000;border-radius:34px;background:linear-gradient(160deg,#ededf0,#bdbdc3);border:2px solid #8a8a90}
          #scr{position:absolute;left:7%;top:3%;width:86%;height:47%;background:#000;border:4px solid #1d1d20;border-radius:16px;overflow:hidden}
          #bar{height:30px;line-height:30px;background:linear-gradient(#484848,#1a1a1a);text-align:center;font-weight:bold;font-size:16px;overflow:hidden;white-space:nowrap}
          #top{position:absolute;left:0;right:0;top:0;height:24px;line-height:24px;background:#000;color:#ccc;font-size:13px;padding:0 10px;overflow:hidden}
          #clk{float:left}#bt{float:right}#wfi{display:block;text-align:center;color:#8ab}
          #bi{display:inline-block;width:24px;height:11px;border:1px solid #ccc;border-radius:2px;margin-left:6px;vertical-align:-1px;padding:1px}#bf{display:block;height:100%;width:50%;background:#4c4}
          .r{height:44px;padding:0 8px 0 12px;font-size:19px;display:flex;align-items:center}
          .tt{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;unicode-bidi:plaintext}.sel .tt{text-overflow:clip}
          .dl{flex:none;width:34px;height:34px;line-height:31px;margin-left:6px;text-align:center;border:1px solid #6c8;border-radius:17px;color:#7d9;font-size:18px}
          #sg .g{display:flex;align-items:center;height:42px;padding:0 6px;font-size:16px;border-bottom:1px solid #222}
          .th{flex:none;width:34px;height:34px;border-radius:4px;margin-right:8px;background:#222}
          .r.sel{background:linear-gradient(#5a9bff,#1f5bd6);color:#fff}
          .s{flex:none;max-width:38%;margin-left:8px;font-size:14px;color:#9ab;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
          .sel .s{color:#dde}
          #np{display:none;padding:8px 10px}
          #art{float:left;width:92px;height:92px;background:#222 center/cover;margin-right:10px;border-radius:6px;text-align:center;line-height:92px;font-size:42px;color:#555}
          #nt{font-size:19px;font-weight:bold;overflow:hidden;white-space:nowrap;margin-top:4px;unicode-bidi:plaintext}
          #na,#nb{font-size:14px;color:#9ab;overflow:hidden;white-space:nowrap;margin-top:3px;unicode-bidi:plaintext}
          #pb{clear:both;height:8px;background:#333;border-radius:4px;margin-top:12px;overflow:hidden}
          #pf{display:block;height:100%;width:0;background:#2f6fe4}
          #tm{font-size:13px;color:#9ab;margin-top:3px;overflow:hidden}
          #tr{float:right}
          #vb{height:6px;background:#333;border-radius:3px;margin-top:8px;overflow:hidden}#vf{display:block;height:100%;width:0;background:#9ab}
          #md{font-size:11px;color:#9ab;margin-top:4px;white-space:nowrap;overflow:hidden}
          #acts{margin-top:6px;white-space:nowrap}
          .pill{display:inline-block;padding:4px 12px;border:1px solid #6c8;border-radius:14px;color:#7d9;font-size:14px;margin-right:8px}
          #shb.on{background:#2f6fe4;border-color:#8bf;color:#fff}
          #dlb{display:none}
          #toast{position:absolute;left:8%;right:8%;bottom:8px;background:#2f6fe4;color:#fff;text-align:center;padding:6px;border-radius:6px;font-size:14px;display:none}
          #qb{position:absolute;left:0;right:0;top:30px;bottom:0;padding:10px;background:#111;display:none;z-index:5}
          #qi{width:100%;font-size:20px;padding:8px;background:#222;color:#fff;border:1px solid #2f6fe4;-webkit-user-select:text}
          #wheel{position:absolute;border-radius:50%;background:#f4f4f6;border:2px solid #b4b4ba}
          #cb{position:absolute;left:31%;top:31%;width:38%;height:38%;border-radius:50%;background:#d2d2d7;border:2px solid #a6a6ac}
          .lb{position:absolute;color:#555;font-size:15px;font-weight:bold}
          </style></head><body>
          <div id="top"><span id="clk"></span><span id="bt"><span id="pc"></span><span id="bi"><i id="bf"></i></span></span><span id="wfi"></span></div>
          <div id="ipod">
          <div id="scr">
            <div id="bar"><span id="title">iPod</span></div>
            <div id="list"></div>
            <div id="np"><div id="art">&#9835;</div><div id="nt"></div><div id="na"></div><div id="nb"></div>
              <div id="pb"><i id="pf"></i></div><div id="tm"><span id="tl">0:00</span><span id="tr">-0:00</span></div><div id="vb"><i id="vf"></i></div><div id="md"></div>
              <div id="acts"><span class="pill" id="shb">&#8644; Shuffle OFF</span><span class="pill" id="dlb">&#8595; Download</span></div></div>
            <div id="qb"><input id="qi" type="text" placeholder="Search..."><div id="sg"></div></div>
            <div id="toast"></div>
          </div>
          <div id="wheel"><div class="lb" style="top:6%;left:0;width:100%;text-align:center">MENU</div>
            <div class="lb" style="left:7%;top:46%">|&lt;&lt;</div><div class="lb" style="right:7%;top:46%">&gt;&gt;|</div>
            <div class="lb" style="bottom:6%;left:0;width:100%;text-align:center">&gt;||</div><div id="cb"></div></div>
          </div>
          <script>
          // ES5 only (old WebViews). Avoid names that clash with window.* (top, scroll, ...)
          var $=function(i){return document.getElementById(i)};
          var BLANK='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
          var S=[],lib=[],pls={},Q=[],cur=-1,st={p:0,d:0,i:-1},ROWS=7,H=null,cbs={},cid=0,dls={},did=0,ttm=null,qmode='aud',npm='vol',shuf=false,rep=0,mqs=[],lastE=0,wasL=false,cv={},recs=null,slp=0,pc=0,sgt=null,sgq=[];
          try{var o=JSON.parse(localStorage.getItem('opt')||'{}');shuf=!!o.s;rep=o.r||0}catch(e){}
          try{cv=JSON.parse(localStorage.getItem('cv')||'{}')}catch(e){}
          try{pls=JSON.parse(localStorage.getItem('pl')||'{}')}catch(e){}
          function optSave(){try{localStorage.setItem('opt',JSON.stringify({s:shuf,r:rep}))}catch(e){}}
          function saveCv(){try{localStorage.setItem('cv',JSON.stringify(cv))}catch(e){}}
          function savePl(){try{localStorage.setItem('pl',JSON.stringify(pls))}catch(e){}}
          function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
          function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+(s%60<10?'0':'')+s%60}
          function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(ttm);ttm=setTimeout(function(){t.style.display='none'},2600)}
          function cs(){return S[S.length-1]}
          function push(sc){sc.sel=0;sc.off=0;S.push(sc);draw()}
          function refresh(f){var k=cs().sel;S.pop();push(f());cs().sel=k;draw()}
          function back(){var s=cs();
           if($('qb').style.display=='block'){$('qb').style.display='none';$('qi').blur();return}
           if(s.title=='Upload'){A.stopServer();loadLib()}
           if(S.length>1){S.pop();draw()}else A.hide()}
          function shuffleArr(l){var a=l.slice(),i,j,t;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t}return a}
          function togShuf(){shuf=!shuf;A.setShuffle(shuf);optSave();shbUpd();toast('Shuffle '+(shuf?'ON':'OFF'))}
          function shbUpd(){var b=$('shb');b.textContent='\u21C4 Shuffle '+(shuf?'ON':'OFF');b.className='pill'+(shuf?' on':'')}

          // ---- drawing ----
          function draw(){var s=cs();$('title').textContent=s.title;
           if(s.np){$('list').style.display='none';$('np').style.display='block';drawNP();return}
           $('np').style.display='none';$('list').style.display='block';
           var n=s.items.length,h='',i;
           if(s.sel<s.off)s.off=s.sel;if(s.sel>=s.off+ROWS)s.off=s.sel-ROWS+1;
           for(i=s.off;i<Math.min(n,s.off+ROWS);i++){var it=s.items[i],im=it.img||(it.tr&&it.tr.img)||'';
            var th=im?'<img class="th" src="'+esc(im)+'">':(it.cov?'<img class="th" data-c="'+i+'" src="'+BLANK+'">':'');
            h+='<div class="r'+(i==s.sel?' sel':'')+'" data-i="'+i+'">'+th+'<div class="tt" dir="auto">'+esc(it.t)+'</div>'+(it.s!=null&&it.s!==''?'<span class="s" dir="auto">'+esc(it.s)+'</span>':'')+(it.dl?'<b class="dl" data-d="'+i+'">&#8595;</b>':'')+'</div>'}
           if(!n)h='<div class="r">'+esc(s.empty||'Empty')+'</div>';
           $('list').innerHTML=h;mqList([document.querySelector('.r.sel .tt')]);loadCovers(s)}
          function isOn(p){return p.indexOf('http')==0||p.indexOf('lazy:')==0}
          function drawNP(){var t=Q[cur],im='';shbUpd();
           if(!t){$('nt').textContent='Not Playing';$('na').textContent='';$('nb').textContent='';$('dlb').style.display='none';$('art').style.backgroundImage='none';$('art').innerHTML='&#9835;';return}
           $('nt').textContent=t.t;$('na').textContent=t.a;$('nb').textContent=t.b+' \u00B7 '+(isOn(t.p)?'Online':src(t.p));$('dlb').style.display=t.p.indexOf('http')==0?'inline-block':'none';
           if(t.img)im=t.img;else if(!isOn(t.p)){try{im=A.art(t.p)}catch(e){}}
           else if(t.p.indexOf('lazy:')==0)coverFor(t,function(u){if(u&&Q[cur]===t&&cs().np)drawNP()});
           $('art').style.backgroundImage=im?'url('+im+')':'none';$('art').innerHTML=im?'':'&#9835;';mqList([$('nt'),$('na')])}
          function coverFor(t,cb){var k=t.t+'|'+t.a;
           if(t.img){cb(t.img);return}
           if(cv[k]){t.img=cv[k];cb(cv[k]);return}
           if(cv[k]===''){cb('');return}
           get('https://itunes.apple.com/search?media=music&entity=song&limit=1&term='+encodeURIComponent(t.t+' '+t.a),function(r){var u='';
            if(r===null){cb('');return}
            try{u=JSON.parse(r).results[0].artworkUrl100.replace('100x100','200x200')}catch(e){}
            cv[k]=u;saveCv();if(u)t.img=u;cb(u)})}
          function loadCovers(s){var im=document.querySelectorAll('#list img[data-c]'),i;
           for(i=0;i<im.length;i++)(function(el){var it=s.items[parseInt(el.getAttribute('data-c'),10)];
            if(it&&it.tr)coverFor(it.tr,function(u){if(u)el.src=u})})(im[i])}

          // ---- navigation ----
          function mv(d){var s=cs();
           if(s.np){if(npm=='vol'){A.vol(d);poll(true)}else{st.p=Math.max(0,st.p+d*5000);A.seek(st.p)}return}
           var n=s.items.length;if(!n)return;s.sel=Math.max(0,Math.min(n-1,s.sel+d));draw()}
          function sel(){var s=cs();if(s.np){npm=npm=='vol'?'seek':'vol';poll(true);return}var it=s.items[s.sel];if(it&&it.f)it.f(it)}
          function ctx(){var s=cs();var it=s.items[s.sel];if(it&&s.ctx)s.ctx(it)}
          var ly=0,lmoved=0,lacc=0;
          $('list').addEventListener('touchstart',function(e){ly=e.touches[0].clientY;lmoved=0;lacc=0},false);
          $('list').addEventListener('touchmove',function(e){var y=e.touches[0].clientY;lacc+=ly-y;ly=y;lmoved+=Math.abs(lacc);
           while(lacc>=40){lacc-=40;mv(1)}while(lacc<=-40){lacc+=40;mv(-1)}e.preventDefault()},false);
          $('list').addEventListener('click',function(e){if(lmoved>25)return;var n=e.target;
           if(n.getAttribute&&n.getAttribute('data-d')!=null){dlTrack(cs().items[parseInt(n.getAttribute('data-d'),10)].tr);return}
           while(n&&n!==this&&!n.getAttribute('data-i'))n=n.parentNode;
           if(n&&n.getAttribute&&n.getAttribute('data-i')!=null){cs().sel=parseInt(n.getAttribute('data-i'),10);draw();sel()}},false);
          $('np').addEventListener('click',function(e){if(e.target.id=='dlb'){dlTrack(Q[cur]);return}if(e.target.id=='shb'){togShuf();return}A.toggle()},false);

          // ---- data ----
          var HITS=[['Blinding Lights','The Weeknd'],['Shape of You','Ed Sheeran'],['Someone Like You','Adele'],['Bohemian Rhapsody','Queen'],['Billie Jean','Michael Jackson'],['Smells Like Teen Spirit','Nirvana'],['Hotel California','Eagles'],['Imagine','John Lennon'],['Rolling in the Deep','Adele'],['Uptown Funk','Mark Ronson'],['Despacito','Luis Fonsi'],['Perfect','Ed Sheeran'],['Believer','Imagine Dragons'],['Counting Stars','OneRepublic'],['Closer','The Chainsmokers'],['Happy','Pharrell Williams'],['Levitating','Dua Lipa'],['As It Was','Harry Styles'],['Flowers','Miley Cyrus'],['Starboy','The Weeknd'],['Lose Yourself','Eminem'],['Numb','Linkin Park'],['Dance Monkey','Tones and I'],['Senorita','Shawn Mendes'],['Thinking Out Loud','Ed Sheeran'],['Hello','Adele'],['Wake Me Up','Avicii'],['Locked Out of Heaven','Bruno Mars'],['Shallow','Lady Gaga'],['Faded','Alan Walker'],['Havana','Camila Cabello'],['See You Again','Wiz Khalifa']];
          var MAR=[['Lm3allem','Saad Lamjarred'],['Ghaltana','Saad Lamjarred'],['Enty','Saad Lamjarred'],['Casablanca','Saad Lamjarred'],['Salina','Saad Lamjarred'],['Mal Hbibi Malou','Saad Lamjarred'],['Youm Wara Youm','Samira Said'],['Essiniya','Nass El Ghiwane']];
          var MART=['Saad Lamjarred','Hatim Ammor','Dizzy DROS','ElGrandeToto','Douzi','Ahmed Chawki','Asma Lmnawar','Zouhair Bahaoui','Hoba Hoba Spirit','Nass El Ghiwane','Muslim','Mehdi Mozayine','Hatim Idar','Oum'];
          var PODS=['\u0641\u0646\u062C\u0627\u0646','\u062B\u0645\u0627\u0646\u064A\u0629','The Joe Rogan Experience','TED Talks Daily','Stuff You Should Know','The Daily','Radiolab','Freakonomics Radio'];
          var SUR=['الفاتحة','البقرة','آل عمران','النساء','المائدة','الأنعام','الأعراف','الأنفال','التوبة','يونس','هود','يوسف','الرعد','إبراهيم','الحجر','النحل','الإسراء','الكهف','مريم','طه','الأنبياء','الحج','المؤمنون','النور','الفرقان','الشعراء','النمل','القصص','العنكبوت','الروم','لقمان','السجدة','الأحزاب','سبأ','فاطر','يس','الصافات','ص','الزمر','غافر','فصلت','الشورى','الزخرف','الدخان','الجاثية','الأحقاف','محمد','الفتح','الحجرات','ق','الذاريات','الطور','النجم','القمر','الرحمن','الواقعة','الحديد','المجادلة','الحشر','الممتحنة','الصف','الجمعة','المنافقون','التغابن','الطلاق','التحريم','الملك','القلم','الحاقة','المعارج','نوح','الجن','المزمل','المدثر','القيامة','الإنسان','المرسلات','النبأ','النازعات','عبس','التكوير','الانفطار','المطففين','الانشقاق','البروج','الطارق','الأعلى','الغاشية','الفجر','البلد','الشمس','الليل','الضحى','الشرح','التين','العلق','القدر','البينة','الزلزلة','العاديات','القارعة','التكاثر','العصر','الهمزة','الفيل','قريش','الماعون','الكوثر','الكافرون','النصر','المسد','الإخلاص','الفلق','الناس'];
          var curRec={name:'مشاري العفاسي',server:'https://download.quranicaudio.com/quran/mishaari_raashid_al_3afaasee/',list:''};
          function pad3(n){return n<10?'00'+n:n<100?'0'+n:''+n}
          function nrm(s){return String(s).toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[\u0623\u0625\u0622]/g,'\u0627').replace(/\u0629/g,'\u0647').replace(/\u0649/g,'\u064A')}
          funct
