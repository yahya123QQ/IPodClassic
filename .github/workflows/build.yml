                              if (l.contains("/ringtones/") || l.contains("/notifications/") || l.contains("/alarms/")) continue;
                              JSONObject o = new JSONObject();
                              o.put("p", p).put("t", c.getString(1)).put("a", c.getString(2)).put("b", c.getString(3)).put("d", c.getLong(4) / 1000);
