      - name: Write app/src/main/java/com/ipod/classic/MainActivity.java
        run: |
          mkdir -p 'app/src/main/java/com/ipod/classic'
          cat > 'app/src/main/java/com/ipod/classic/MainActivity.java' <<'EOF_X'
          package com.ipod.classic;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.media.AudioManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          public class MainActivity extends Activity {
              WebView w;

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setVolumeControlStream(AudioManager.STREAM_MUSIC);   // volume keys always control music
                  w = new WebView(this);
                  w.setBackgroundColor(Color.BLACK);
                  WebSettings s = w.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);                         // playlists / options saved in localStorage
                  s.setAllowFileAccess(true);
                  if (Build.VERSION.SDK_INT >= 21) s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  final Bridge br = new Bridge(this, w);
                  w.addJavascriptInterface(br, "A");
                  new Thread(new Runnable() { public void run() { br.killBg(); } }).start();   // entering the system: close other apps to save battery
                  setContentView(w);
                  w.loadUrl("file:///android_asset/index.html");
                  if (Build.VERSION.SDK_INT >= 23 && (checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED
                          || checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED)) {
                      requestPermissions(new String[]{Manifest.permission.READ_EXTERNAL_STORAGE, Manifest.permission.WRITE_EXTERNAL_STORAGE}, 1);
                  }
              }

              @Override public void onRequestPermissionsResult(int code, String[] perms, int[] res) {
                  super.onRequestPermissionsResult(code, perms, res);
                  w.evaluateJavascript("if(window.loadLib){loadLib();if(window.draw)draw()}", null);
              }

              void immersive() {
                  getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }

              @Override protected void onResume() { super.onResume(); w.onResume(); immersive(); }
              @Override public void onWindowFocusChanged(boolean f) { super.onWindowFocusChanged(f); if (f) immersive(); }
              // JS timers stop while hidden (saves battery) - playback itself is native and keeps going
              @Override protected void onPause() { super.onPause(); w.onPause(); }
              @Override public void onBackPressed() { w.evaluateJavascript("back()", null); }
          }
          EOF_X

      - name: Write app/src/main/java/com/ipod/classic/KeepAliveService.java
        run: |
          mkdir -p 'app/src/main/java/com/ipod/classic'
          cat > 'app/src/main/java/com/ipod/classic/KeepAliveService.java' <<'EOF_X'
          package com.ipod.classic;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.media.AudioManager;
          import android.net.wifi.WifiManager;
          import android.os.Build;
          import android.os.IBinder;

          /** Foreground service: keeps the process alive so music (and auto-advance) continues with the screen off. */
          public class KeepAliveService extends Service {
              static void start(Context c) {
                  if (c == null) return;
                  try {
                      Intent i = new Intent(c, KeepAliveService.class);
                      if (Build.VERSION.SDK_INT >= 26) c.startForegroundService(i); else c.startService(i);
                  } catch (Exception e) {}
              }

              static void stop(Context c) {
                  if (c != null) c.stopService(new Intent(c, KeepAliveService.class));
              }

              WifiManager.WifiLock wl;

              final BroadcastReceiver noisy = new BroadcastReceiver() {
                  @Override public void onReceive(Context c, Intent i) { Player.pause(); }
              };

              @Override public void onCreate() {
                  super.onCreate();
                  registerReceiver(noisy, new IntentFilter(AudioManager.ACTION_AUDIO_BECOMING_NOISY));
                  try {
                      WifiManager wm = (WifiManager) getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                      wl = wm.createWifiLock(WifiManager.WIFI_MODE_FULL, "ipod");
                      wl.acquire();
                  } catch (Exception e) {}
              }

              @Override public void onDestroy() {
                  try { unregisterReceiver(noisy); } catch (Exception e) {}
                  try { if (wl != null && wl.isHeld()) wl.release(); } catch (Exception e) {}
                  super.onDestroy();
              }

              @Override public int onStartCommand(Intent i, int f, int id) {
                  PendingIntent pi = PendingIntent.getActivity(this, 0, new Intent(this, MainActivity.class),
