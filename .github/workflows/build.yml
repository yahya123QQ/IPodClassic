          package com.ipod.classic;

          import android.content.Context;
          import android.media.AudioAttributes;
          import android.media.AudioManager;
          import android.media.MediaPlayer;
          import android.os.PowerManager;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.File;
          import java.io.FileInputStream;
          import java.util.ArrayList;
          import java.util.List;

          /** Native playback: keeps playing (and auto-advancing) with the screen off.
           *  Local files play directly. Web streams are first fetched to the cache (old Android often
           *  cannot verify new HTTPS certificates inside MediaPlayer, which was the cause of silence). */
          public class Player {
              static MediaPlayer mp;
              static Context app;
              static final List<String> q = new ArrayList<>();
              static int idx = -1, repeat = 0, gen = 0;           // repeat: 0 off, 1 all, 2 one
              static boolean ready = false, shuffle = false, focusPaused = false, loading = false;
              static String err = "";

              static final AudioManager.OnAudioFocusChangeListener FL = c -> {
                  synchronized (Player.class) {
                      try {
                          if (mp == null || !ready) return;
                          if (c == AudioManager.AUDIOFOCUS_LOSS) { if (mp.isPlaying()) mp.pause(); focusPaused = false; }
                          else if (c == AudioManager.AUDIOFOCUS_LOSS_TRANSIENT) { if (mp.isPlaying()) { mp.pause(); focusPaused = true; } }
                          else if (c == AudioManager.AUDIOFOCUS_LOSS_TRANSIENT_CAN_DUCK) mp.setVolume(0.2f, 0.2f);
                          else if (c == AudioManager.AUDIOFOCUS_GAIN) { mp.setVolume(1f, 1f); if (focusPaused) { mp.start(); focusPaused = false; } }
                      } catch (Exception e) {}
                  }
              };

              static synchronized void setQueue(Context c, JSONArray a, int start) {
                  app = c.getApplicationContext();
                  q.clear();
                  for (int i = 0; i < a.length(); i++) q.add(a.optString(i));
                  play(start);
              }

              static synchronized void play(final int i) {
                  if (i < 0 || i >= q.size()) return;
                  idx = i; ready = false; err = "";
                  final int g = ++gen;
                  final String src = q.get(i);
                  try { if (mp != null) mp.reset(); } catch (Exception e) {}
                  KeepAliveService.start(app);
                  if (src.startsWith("http")) {
                      loading = true;
                      new Thread(() -> {
                          try { File f = Bridge.cacheStream(app, src); start(f.getPath(), g); }
                          catch (Exception e) { fail(g, "Cannot load this track"); }
                      }).start();
                  } else { start(src, g); }
              }

              static synchronized void start(String path, int g) {
                  if (g != gen) return;                      // user already moved to another track
                  loading = false;
                  try {
                      File f = new File(path);
                      if (!f.exists() || f.length() == 0) { fail(g, "File missing or empty"); return; }
                      AudioManager am = (AudioManager) app.getSystemService(Context.AUDIO_SERVICE);
                      am.requestAudioFocus(FL, AudioManager.STREAM_MUSIC, AudioManager.AUDIOFOCUS_GAIN);
                      ensureVolume(am);
                      if (mp == null) {
                          mp = new MediaPlayer();
                          mp.setOnPreparedListener(m -> { synchronized (Player.class) { ready = true; } m.start(); });
                          mp.setOnCompletionListener(m -> done());
                          mp.setOnErrorListener((m, what, extra) -> { fail(gen, "Playback error " + what + "/" + extra); return true; });
                      }
                      mp.reset();
                      mp.setAudioAttributes(new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build());
                      mp.setWakeMode(app, PowerManager.PARTIAL_WAKE_LOCK);
                      mp.setVolume(1f, 1f);
                      FileInputStream in = new FileInputStream(f);
                      try { mp.setDataSource(in.getFD()); } finally { in.close(); }
                      mp.prepareAsync();
                  } catch (Exception e) { fail(g, "Cannot play: " + e.getClass().getSimpleName()); }
              }

              /** Make sure the media volume is not muted / near zero when a song starts. */
              static void ensureVolume(AudioManager am) {
                  try {
                      int max = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC), v = am.getStreamVolume(AudioManager.STREAM_MUSIC);
                      if (v < max / 3) am.setStreamVolume(AudioManager.STREAM_MUSIC, Math.max(1, max * 6 / 10), 0);
                  } catch (Exception e) {}
              }

              static synchronized void fail(int g, String msg) {
                  if (g != gen) return;
                  loading = false; ready = false; err = msg;
                  try { if (mp != null) mp.reset(); } catch (Exception e) {}
              }

              static synchronized void done() { if (repeat == 2) play(idx); else next(); }

              static synchronized void next() {
                  if (q.isEmpty()) return;
                  int n = idx + 1;
                  if (shuffle && q.size() > 1) { do { n = (int) (Math.random() * q.size()); } while (n == idx); }
                  if (n < q.size()) play(n);
                  else if (repeat == 1) play(0);
                  else { gen++; try { if (mp != null) mp.reset(); } catch (Exception e) {} ready = false; loading = false; KeepAliveService.stop(app); }
              }

              static synchronized void prev() {
                  try {
                      if (ready && mp.getCurrentPosition() > 3000) mp.seekTo(0);
                      else if (idx > 0) play(idx - 1);
                  } catch (Exception e) {}
              }

              static synchronized void toggle() {
                  try {
                      if (loading) return;
                      if (!ready) { if (idx >= 0) play(idx); return; }   // retry after an error / end of queue
                      if (mp.isPlaying()) mp.pause(); else mp.start();
                  } catch (Exception e) {}
              }

              static synchronized void pause() { try { if (mp != null && ready && mp.isPlaying()) mp.pause(); } catch (Exception e) {} }

              static synchronized void seek(int ms) {
                  try { if (ready) mp.seekTo(Math.max(0, Math.min(ms, mp.getDuration()))); } catch (Exception e) {}
              }

              static synchronized String state() {
                  int p = 0, d = 0; boolean pl = false;
                  if (mp != null && ready) { try { p = mp.getCurrentPosition(); d = mp.getDuration(); pl = mp.isPlaying(); } catch (Exception e) {} }
                  return "{\"i\":" + idx + ",\"p\":" + p + ",\"d\":" + d + ",\"pl\":" + pl + ",\"r\":" + repeat + ",\"s\":" + shuffle
                      + ",\"l\":" + loading + ",\"e\":" + JSONObject.quote(err) + "}";
              }
          }
          EOF_X
          cat > 'build.gradle' <<'EOF_X'
          plugins { id 'com.android.application' version '7.4.2' apply false }
          EOF_X
          mkdir -p 'gradle/wrapper'
          cat > 'gradle/wrapper/gradle-wrapper.properties' <<'EOF_X'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-7.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF_X
          cat > 'settings.gradle' <<'EOF_X'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "IPodClassic"
          include ':app'
          EOF_X
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 33
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2" || true
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.5'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: iPod-APK
          path: app/build/outputs/apk/debug/app-debug.apk
