name: Build iPod Classic APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK Manually
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"

          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          sdkmanager --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools:$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Create Android project with iPod Classic UI & Playback Engine
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p app/src/main/java/com/ipodclassic/player
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          echo "sdk.dir=$SDK_ROOT" > local.properties

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "iPodClassicPlayer"
          include ':app'
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.ipodclassic.player'
              compileSdk 34

              defaultConfig {
                  applicationId "com.ipodclassic.player"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat << 'EOF' > app/proguard-rules.pro
          # Keep classes
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">iPod Classic</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#111111">

              <WebView
                  android:id="@+id/webview"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />
          </FrameLayout>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/ipodclassic/player/MainActivity.java
          package com.ipodclassic.player;

          import android.Manifest;
          import android.content.ContentResolver;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.media.AudioAttributes;
          import android.media.MediaPlayer;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private MediaPlayer mediaPlayer;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  requestAudioPermission();

                  mediaPlayer = new MediaPlayer();
                  mediaPlayer.setAudioAttributes(
                      new AudioAttributes.Builder()
                          .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                          .setUsage(AudioAttributes.USAGE_MEDIA)
                          .build()
                  );

                  mediaPlayer.setOnCompletionListener(mp -> runOnUiThread(() ->
                      webView.evaluateJavascript("if(window.onNativeTrackEnded){window.onNativeTrackEnded();}", null)
                  ));

                  webView = findViewById(R.id.webview);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.addJavascriptInterface(new NativeBridge(), "AndroidBridge");
                  webView.loadUrl("file:///android_asset/index.html");
              }

              private void requestAudioPermission() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_AUDIO)
                              != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.READ_MEDIA_AUDIO}, 101);
                      }
                  } else {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE)
                              != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.READ_EXTERNAL_STORAGE}, 101);
                      }
                  }
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  if (mediaPlayer != null) {
                      mediaPlayer.release();
                      mediaPlayer = null;
                  }
              }

              public class NativeBridge {
                  @JavascriptInterface
                  public void playUrl(String url) {
                      runOnUiThread(() -> {
                          try {
                              mediaPlayer.reset();
                              mediaPlayer.setDataSource(url);
                              mediaPlayer.prepareAsync();
                              mediaPlayer.setOnPreparedListener(mp -> {
                                  mp.start();
                                  webView.evaluateJavascript("if(window.onNativeStateChange){window.onNativeStateChange(true);}", null);
                              });
                          } catch (Exception e) {
                              e.printStackTrace();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void togglePlayPause() {
                      runOnUiThread(() -> {
                          if (mediaPlayer == null) return;
                          if (mediaPlayer.isPlaying()) {
                              mediaPlayer.pause();
                              webView.evaluateJavascript("if(window.onNativeStateChange){window.onNativeStateChange(false);}", null);
                          } else {
                              mediaPlayer.start();
                              webView.evaluateJavascript("if(window.onNativeStateChange){window.onNativeStateChange(true);}", null);
                          }
                      });
                  }

                  @JavascriptInterface
                  public void seekTo(int seconds) {
                      runOnUiThread(() -> {
                          if (mediaPlayer != null) {
                              mediaPlayer.seekTo(seconds * 1000);
                          }
                      });
                  }

                  @JavascriptInterface
                  public String getPlaybackStatus() {
                      try {
                          JSONObject obj = new JSONObject();
                          boolean playing = mediaPlayer != null && mediaPlayer.isPlaying();
                          int pos = mediaPlayer != null ? mediaPlayer.getCurrentPosition() / 1000 : 0;
                          int dur = mediaPlayer != null && mediaPlayer.getDuration() > 0 ? mediaPlayer.getDuration() / 1000 : 0;
                          obj.put("playing", playing);
                          obj.put("position", pos);
                          obj.put("duration", dur);
                          return obj.toString();
                      } catch (Exception e) {
                          return "{\"playing\":false,\"position\":0,\"duration\":0}";
                      }
                  }

                  @JavascriptInterface
                  public String getLocalTracks() {
                      JSONArray list = new JSONArray();
                      try {
                          ContentResolver resolver = getContentResolver();
                          Uri uri = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI;
                          String[] projection = {
                              MediaStore.Audio.Media._ID,
                              MediaStore.Audio.Media.TITLE,
                              MediaStore.Audio.Media.ARTIST,
                              MediaStore.Audio.Media.DATA
                          };
                          Cursor cursor = resolver.query(uri, projection, MediaStore.Audio.Media.IS_MUSIC + " != 0", null, null);
                          if (cursor != null) {
                              while (cursor.moveToNext()) {
                                  JSONObject item = new JSONObject();
                                  item.put("id", cursor.getString(0));
                                  item.put("title", cursor.getString(1) != null ? cursor.getString(1) : "Local Track");
                                  item.put("artist", cursor.getString(2) != null ? cursor.getString(2) : "Local Artist");
                                  item.put("url", "file://" + cursor.getString(3));
                                  item.put("source", "Local");
                                  item.put("category", "songs");
                                  list.put(item);
                              }
                              cursor.close();
                          }
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                      return list.toString();
                  }

                  @JavascriptInterface
                  public String cacheTrackOnce(String id, String url) {
                      try {
                          File cacheDir = new File(getCacheDir(), "tracks");
                          if (!cacheDir.exists()) cacheDir.mkdirs();
                          String safeName = id.replaceAll("[^a-zA-Z0-9_-]", "_") + ".mp3";
                          File outFile = new File(cacheDir, safeName);
                          if (outFile.exists() && outFile.length() > 1024) {
                              return "file://" + outFile.getAbsolutePath();
                          }
                          URL u = new URL(url);
                          HttpURLConnection conn = (HttpURLConnection) u.openConnection();
                          conn.setConnectTimeout(10000);
                          conn.setReadTimeout(15000);
                          conn.connect();
                          if (conn.getResponseCode() == 200) {
                              InputStream in = conn.getInputStream();
                              FileOutputStream out = new FileOutputStream(outFile);
                              byte[] buf = new byte[4096];
                              int len;
                              while ((len = in.read(buf)) != -1) {
                                  out.write(buf, 0, len);
                              }
                              out.flush();
                              out.close();
                              in.close();
                              return "file://" + outFile.getAbsolutePath();
                          }
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                      return url;
                  }
              }
          }
          EOF

