                { id: "q_yaseen", title: "Surat Ya-Sin", artist: "Maher Al Muaiqly", art: "https://archive.org/services/img/maher_almuaiqly_128kbps", url: "https://server12.mp3quran.net/maher/036.mp3", source: "Quran", popularity: 97000 },
                { id: "q_rahman", title: "Surat Ar-Rahman", artist: "Yasser Al-Dosari", art: "https://archive.org/services/img/yasser_128kbps", url: "https://server11.mp3quran.net/yasser/055.mp3", source: "Quran", popularity: 96000 },
                { id: "q_mulk", title: "Surat Al-Mulk", artist: "Mishary Rashid Alafasy", art: "https://archive.org/services/img/Alafasy_128kbps", url: "https://server8.mp3quran.net/afs/067.mp3", source: "Quran", popularity: 95000 }
              ];

              const state = {
                activeTab: "songs",
                tracks: [...FEATURED_SONGS],
                currentIndex: -1,
                shuffle: false,
                inNowPlaying: false
              };

              const artCache = new Map();

              function fmt(sec) {
                sec = Math.max(0, Math.floor(sec || 0));
                const m = Math.floor(sec / 60);
                const s = sec % 60;
                return `${m}:${s < 10 ? "0" : ""}${s}`;
              }

              function setNowPlayingMode(active) {
                state.inNowPlaying = active;
                document.getElementById("tabsBar").style.display = active ? "none" : "flex";
                document.getElementById("searchBar").style.display = active ? "none" : "flex";
                document.getElementById("resultsList").style.display = active ? "none" : "block";
                document.getElementById("nowPlayingView").classList.toggle("active", active);
                document.getElementById("screenTitle").textContent = active ? "Now Playing" : "iPod Classic";
              }

              function updateShuffleUI() {
                const btn = document.getElementById("shuffleBtn");
                const lbl = document.getElementById("shuffleLabel");
                btn.classList.toggle("on", state.shuffle);
                lbl.textContent = state.shuffle ? "Shuffle: ON" : "Shuffle: OFF";
              }

              function popularityScore(track, query) {
                const q = (query || "").toLowerCase().trim();
                const title = (track.title || "").toLowerCase();
                const artist = (track.artist || "").toLowerCase();
                let score = track.popularity || 0;

                if (q) {
                  if (title === q) score += 700;
                  else if (title.startsWith(q)) score += 350;
                  else if (title.includes(q)) score += 160;

                  if (artist.includes(q)) score += 100;
                  if (/\b(remix|lofi|slowed|reverb|cover|nightcore|instrumental)\b/i.test(title) &&
                      !/\b(remix|lofi|slowed|reverb|cover|nightcore|instrumental)\b/i.test(q)) {
                    score -= 220;
                  }
                }
                return score;
              }

              async function searchAudius(q) {
                const res = await fetch(`https://discoveryprovider.audius.co/v1/tracks/search?query=${encodeURIComponent(q)}&app_name=ipod_classic`);
                const data = await res.json();
                const arr = Array.isArray(data.data) ? data.data : [];
                return arr.map(t => ({
                  id: "audius_" + t.id,
                  title: t.title || "Unknown Title",
                  artist: (t.user && (t.user.name || t.user.handle)) || "Audius Artist",
                  art: (t.artwork && (t.artwork["150x150"] || t.artwork["480x480"])) || "",
                  url: `https://discoveryprovider.audius.co/v1/tracks/${t.id}/stream?app_name=ipod_classic`,
                  source: "Audius",
                  popularity: (t.play_count || 0) + (t.favorite_count || 0) * 5
                }));
              }

              async function searchArchiveAudio(q) {
                const url = `https://archive.org/advancedsearch.php?q=${encodeURIComponent(q + " AND mediatype:audio")}&fl[]=identifier,title,creator,downloads&rows=12&page=1&output=json`;
                const res = await fetch(url);
                const data = await res.json();
                const docs = (data.response && data.response.docs) || [];
                return docs.map(d => ({
                  id: "archive_" + d.identifier,
                  title: Array.isArray(d.title) ? d.title[0] : (d.title || d.identifier),
                  artist: Array.isArray(d.creator) ? d.creator[0] : (d.creator || "Internet Archive"),
                  art: `https://archive.org/services/img/${d.identifier}`,
                  url: `https://archive.org/download/${d.identifier}`,
                  source: "Archive",
                  popularity: Number(d.downloads || 0)
                }));
              }

              async function searchPodcasts(q) {
                const res = await fetch(`https://itunes.apple.com/search?media=podcast&limit=15&term=${encodeURIComponent(q || "news")}`);
                const data = await res.json();
                const items = Array.isArray(data.results) ? data.results : [];
                return items.filter(p => p.feedUrl || p.artworkUrl100).map((p, idx) => ({
                  id: "pod_" + (p.collectionId || idx),
                  title: p.trackName || p.collectionName || "Podcast",
                  artist: p.artistName || "Podcast",
                  art: p.artworkUrl100 || p.artworkUrl60 || "",
                  url: p.feedUrl || "",
                  source: "Podcast",
                  popularity: 5000 - idx * 150
                }));
              }

              function renderList(tracks) {
                const listEl = document.getElementById("resultsList");
                listEl.innerHTML = "";
                tracks.forEach((t, idx) => {
                  const row = document.createElement("div");
                  row.className = "item";
                  const imgSrc = artCache.get(t.id) || t.art || "";
                  row.innerHTML = `
                    <img class="thumb" src="${imgSrc}" onerror="this.style.visibility='hidden'" />
                    <div class="meta">
                      <div class="title">${escapeHtml(t.title)}</div>
                      <div class="sub">${escapeHtml(t.artist)}</div>
                    </div>
                    <div class="badge">${escapeHtml(t.source)}</div>
                  `;
                  row.onclick = () => playTrackAt(idx);
                  listEl.appendChild(row);
                });
              }

              function escapeHtml(s) {
                return String(s || "").replace(/[&<>"']/g, c => ({
                  "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
                }[c]));
              }

              async function switchTab(tabName) {
                state.activeTab = tabName;
                document.querySelectorAll(".tab-btn").forEach(b => {
                  b.classList.toggle("active", b.dataset.tab === tabName);
                });
                setNowPlayingMode(false);

                if (tabName === "songs") {
                  document.getElementById("modeTag").textContent = "Songs";
                  state.tracks = [...FEATURED_SONGS];
                  renderList(state.tracks);
                } else if (tabName === "quran") {
                  document.getElementById("modeTag").textContent = "Quran";
                  state.tracks = [...QURAN_TRACKS];
                  renderList(state.tracks);
                } else if (tabName === "podcasts") {
                  document.getElementById("modeTag").textContent = "Podcasts...";
                  const pods = await searchPodcasts(document.getElementById("queryInput").value.trim() || "top");
                  state.tracks = pods;
                  renderList(state.tracks);
                  document.getElementById("modeTag").textContent = `Podcasts (${pods.length})`;
                }
              }

              async function performSearch() {
                const q = document.getElementById("queryInput").value.trim();
                setNowPlayingMode(false);

                if (state.activeTab === "quran") {
                  const filtered = QURAN_TRACKS.filter(item =>
                    !q || item.title.toLowerCase().includes(q.toLowerCase()) || item.artist.toLowerCase().includes(q.toLowerCase())
                  );
                  state.tracks = filtered;
                  renderList(state.tracks);
                  document.getElementById("modeTag").textContent = `Quran (${filtered.length})`;
                  return;
                }

                if (state.activeTab === "podcasts") {
                  document.getElementById("modeTag").textContent = "Searching...";
                  const pods = await searchPodcasts(q || "top");
                  state.tracks = pods;
                  renderList(state.tracks);
                  document.getElementById("modeTag").textContent = `Podcasts (${pods.length})`;
                  return;
                }

                if (!q) {
                  state.tracks = [...FEATURED_SONGS];
                  renderList(state.tracks);
                  document.getElementById("modeTag").textContent = "Songs";
                  return;
                }

                document.getElementById("modeTag").textContent = "Searching...";
                const localMatches = FEATURED_SONGS.filter(s =>
                  s.title.toLowerCase().includes(q.toLowerCase()) || s.artist.toLowerCase().includes(q.toLowerCase())
                );
                const results = await Promise.allSettled([
                  searchAudius(q),
                  searchArchiveAudio(q)
                ]);

                let merged = [...localMatches];
                results.forEach(r => {
                  if (r.status === "fulfilled" && Array.isArray(r.value)) {
                    merged = merged.concat(r.value);
                  }
                });

                merged.sort((a, b) => popularityScore(b, q) - popularityScore(a, q));
                state.tracks = merged.slice(0, 30);
                renderList(state.tracks);
                document.getElementById("modeTag").textContent = `${state.tracks.length} results`;
              }

              function loadLocal() {
                setNowPlayingMode(false);
                if (window.AndroidBridge && window.AndroidBridge.getLocalTracks) {
                  try {
                    const local = JSON.parse(window.AndroidBridge.getLocalTracks());
                    state.tracks = local;
                    renderList(state.tracks);
                    document.getElementById("modeTag").textContent = `Local (${local.length})`;
                  } catch (e) {
                    document.getElementById("modeTag").textContent = "Local error";
                  }
                }
              }

              function playTrackAt(index) {
                if (!state.tracks.length || index < 0 || index >= state.tracks.length) return;
                state.currentIndex = index;
                const track = state.tracks[index];

                if (track.art) {
                  artCache.set(track.id, track.art);
                }

                setNowPlayingMode(true);
                document.getElementById("npTitle").textContent = track.title;
                document.getElementById("npArtist").textContent = track.artist;
                document.getElementById("npArt").src = artCache.get(track.id) || "";
                document.getElementById("npStatus").textContent = "Loading...";

                let finalUrl = track.url;
                if (window.AndroidBridge && finalUrl && finalUrl.startsWith("http") && track.source !== "Podcast") {
                  try {
                    finalUrl = window.AndroidBridge.cacheTrackOnce(track.id, finalUrl);
                  } catch (e) {}
                }

                if (window.AndroidBridge && window.AndroidBridge.playUrl && finalUrl) {
                  window.AndroidBridge.playUrl(finalUrl);
                }
              }

              function nextTrack() {
                if (!state.tracks.length) return;
                if (state.shuffle && state.tracks.length > 1) {
                  let nextIdx = Math.floor(Math.random() * state.tracks.length);
                  if (nextIdx === state.currentIndex) {
                    nextIdx = (state.currentIndex + 1) % state.tracks.length;
                  }
                  playTrackAt(nextIdx);
                } else {
                  playTrackAt((state.currentIndex + 1) % state.tracks.length);
                }
              }

              function prevTrack() {
                if (!state.tracks.length) return;
                playTrackAt((state.currentIndex - 1 + state.tracks.length) % state.tracks.length);
              }

              window.onNativeStateChange = function(isPlaying) {
                document.getElementById("npStatus").textContent = isPlaying ? "Playing" : "Paused";
              };

              window.onNativeTrackEnded = function() {
                nextTrack();
              };

              setInterval(() => {
                if (!state.inNowPlaying) return;
                if (window.AndroidBridge && window.AndroidBridge.getPlaybackStatus) {
                  try {
                    const st = JSON.parse(window.AndroidBridge.getPlaybackStatus());
                    document.getElementById("curTime").textContent = fmt(st.position);
                    document.getElementById("durTime").textContent = fmt(st.duration);
                    const slider = document.getElementById("seekSlider");
                    slider.max = st.duration || 100;
                    slider.value = st.position || 0;
                    document.getElementById("npStatus").textContent = st.playing ? "Playing" : "Paused";
                  } catch (e) {}
                }
              }, 700);

              document.getElementById("tabSongs").onclick = () => switchTab("songs");
              document.getElementById("tabPodcasts").onclick = () => switchTab("podcasts");
              document.getElementById("tabQuran").onclick = () => switchTab("quran");
              document.getElementById("searchBtn").onclick = performSearch;
              document.getElementById("queryInput").addEventListener("keydown", e => {
                if (e.key === "Enter") performSearch();
              });
              document.getElementById("localBtn").onclick = loadLocal;
              document.getElementById("shuffleBtn").onclick = () => {
                state.shuffle = !state.shuffle;
                updateShuffleUI();
              };
              document.getElementById("seekSlider").onchange = e => {
                if (window.AndroidBridge && window.AndroidBridge.seekTo) {
                  window.AndroidBridge.seekTo(Number(e.target.value));
                }
              };
              document.getElementById("playBtn").onclick = () => {
                if (window.AndroidBridge && window.AndroidBridge.togglePlayPause) {
                  window.AndroidBridge.togglePlayPause();
                }
              };
              document.getElementById("centerBtn").onclick = () => {
                if (!state.inNowPlaying && state.tracks.length) {
                  playTrackAt(state.currentIndex >= 0 ? state.currentIndex : 0);
                } else if (window.AndroidBridge && window.AndroidBridge.togglePlayPause) {
                  window.AndroidBridge.togglePlayPause();
                }
              };
              document.getElementById("nextBtn").onclick = nextTrack;
              document.getElementById("prevBtn").onclick = prevTrack;
              document.getElementById("menuBtn").onclick = () => setNowPlayingMode(false);

              updateShuffleUI();
              renderList(state.tracks);
            </script>
          </body>
          </html>
          EOF

          gradle wrapper --gradle-version 8.7 --distribution-type bin --no-daemon --warning-mode=summary
          ./gradlew assembleDebug --no-daemon --warning-mode=summary

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iPodClassic-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
