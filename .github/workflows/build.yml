                  Notification.Builder b;
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      nm.createNotificationChannel(new NotificationChannel("ipod", "iPod playback", NotificationManager.IMPORTANCE_LOW));
                      b = new Notification.Builder(this, "ipod");
                  } else {
                      b = new Notification.Builder(this);
                  }
                  b.setContentTitle("iPod").setContentText("Playing music")
                      .setSmallIcon(android.R.drawable.ic_media_play).setContentIntent(pi).setOngoing(true);
                  startForeground(1, b.build());
                  return START_STICKY;
              }

              @Override public IBinder onBind(Intent i) { return null; }
          }
