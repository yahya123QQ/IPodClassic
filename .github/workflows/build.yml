          mkdir -p 'app/src/main/java/com/ipod/classic'
          cat > 'app/src/main/java/com/ipod/classic/Net.java' <<'EOF_X'
          package com.ipod.classic;

          import java.io.BufferedReader;
          import java.io.IOException;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.security.cert.X509Certificate;
          import javax.net.ssl.HttpsURLConnection;
          import javax.net.ssl.SSLContext;
          import javax.net.ssl.SSLException;
          import javax.net.ssl.SSLSocketFactory;
          import javax.net.ssl.TrustManager;
          import javax.net.ssl.X509TrustManager;

          /** HTTP helper: follows redirects (also http<->https). Old Android versions reject newer
           *  certificate chains, so on an SSL failure it retries once without chain validation
           *  (only public music/podcast data is ever requested - never logins or personal data). */
          public class Net {
              static SSLSocketFactory LAX;

              static SSLSocketFactory lax() {
                  if (LAX == null) {
                      try {
                          TrustManager[] t = new TrustManager[]{new X509TrustManager() {
                              public void checkClientTrusted(X509Certificate[] c, String a) {}
                              public void checkServerTrusted(X509Certificate[] c, String a) {}
                              public X509Certificate[] getAcceptedIssuers() { return new X509Certificate[0]; }
                          }};
                          SSLContext sc = SSLContext.getInstance("TLS");
                          sc.init(null, t, null);
                          LAX = sc.getSocketFactory();
                      } catch (Exception e) {}
                  }
                  return LAX;
              }

              static HttpURLConnection conn(String u, boolean relaxed) throws IOException {
                  HttpURLConnection h = (HttpURLConnection) new URL(u).openConnection();
                  if (relaxed && h instanceof HttpsURLConnection) ((HttpsURLConnection) h).setSSLSocketFactory(lax());
                  h.setInstanceFollowRedirects(false);
                  h.setConnectTimeout(15000);
                  h.setReadTimeout(25000);
                  h.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android) iPodClassic");
                  return h;
              }

              static HttpURLConnection open(String u) throws IOException {
                  boolean relaxed = false;
                  for (int i = 0; i < 7; i++) {
                      HttpURLConnection h = conn(u, relaxed);
                      int c;
                      try {
                          c = h.getResponseCode();
                      } catch (SSLException e) {
                          if (relaxed) throw e;
                          relaxed = true;
                          i--;
                          continue;
                      }
                      if (c >= 300 && c < 400) {
                          String l = h.getHeaderField("Location");
                          h.disconnect();
                          if (l == null) break;
                          u = new URL(new URL(u), l).toString();
                          continue;
                      }
                      return h;
                  }
                  throw new IOException("redirects");
              }

              static String text(String u) throws IOException {
                  HttpURLConnection h = open(u);
                  if (h.getResponseCode() >= 400) throw new IOException("HTTP " + h.getResponseCode());
                  BufferedReader br = new BufferedReader(new InputStreamReader(h.getInputStream(), "UTF-8"));
                  StringBuilder sb = new StringBuilder();
                  char[] buf = new char[8192];
                  int n;
                  while ((n = br.read(buf)) > 0 && sb.length() < 1500000) sb.append(buf, 0, n);
                  br.close();
                  return sb.toString();
              }
          }
          EOF_X

