                      PackageManager pm = a.getPackageManager();
                      for (ActivityManager.RunningAppProcessInfo p : am.getRunningAppProcesses()) {
                          if (p.importance < ActivityManager.RunningAppProcessInfo.IMPORTANCE_SERVICE) continue;
