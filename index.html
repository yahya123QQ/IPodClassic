<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>iPod</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none}
html,body{width:100%;height:100%;background:#0b0b0c;color:#eee;font-family:sans-serif;overflow:hidden}
#ipod{position:absolute;box-shadow:0 6px 24px #000;border-radius:34px;background:linear-gradient(160deg,#ededf0,#bdbdc3);border:2px solid #8a8a90}
#scr{position:absolute;left:7%;top:3%;width:86%;height:47%;background:#000;border:4px solid #1d1d20;border-radius:16px;overflow:hidden}
#bar{height:30px;line-height:30px;background:linear-gradient(#484848,#1a1a1a);position:relative;text-align:center;font-weight:bold;font-size:16px}
#top{position:absolute;left:0;right:0;top:0;height:24px;line-height:24px;background:#000;color:#ccc;font-size:13px;padding:0 10px;overflow:hidden}
#clk{float:left}#bt{float:right}#wfi{display:block;text-align:center;color:#8ab}
#bi{display:inline-block;width:24px;height:11px;border:1px solid #ccc;border-radius:2px;margin-left:6px;vertical-align:-1px;padding:1px}#bf{display:block;height:100%;width:50%;background:#4c4}
.r{height:44px;padding:0 8px 0 12px;font-size:19px;display:flex;align-items:center}
.tt{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.sel .tt{text-overflow:clip}
.dl{flex:none;width:34px;height:34px;line-height:31px;margin-left:6px;text-align:center;border:1px solid #6c8;border-radius:17px;color:#7d9;font-size:18px}
#sg .g{display:flex;align-items:center;height:42px;padding:0 6px;font-size:16px;border-bottom:1px solid #222}
.th{flex:none;width:34px;height:34px;border-radius:4px;margin-right:8px;background:#222}
#dlb{display:none;margin-top:8px;padding:4px 14px;border:1px solid #6c8;border-radius:14px;color:#7d9;font-size:14px}
.r.sel{background:linear-gradient(#5a9bff,#1f5bd6);color:#fff}
.s{flex:none;max-width:38%;margin-left:8px;font-size:14px;color:#9ab;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sel .s{color:#dde}
#np{display:none;padding:10px}
#art{float:left;width:112px;height:112px;background:#222 center/cover;margin-right:10px;border-radius:6px;text-align:center;line-height:112px;font-size:50px;color:#555}
#nt{font-size:20px;font-weight:bold;overflow:hidden;white-space:nowrap;margin-top:8px}
#na,#nb{font-size:15px;color:#9ab;overflow:hidden;white-space:nowrap;margin-top:4px}
#pb{clear:both;height:8px;background:#333;border-radius:4px;margin-top:18px;overflow:hidden}
#pf{display:block;height:100%;width:0;background:#2f6fe4}
#tm{font-size:13px;color:#9ab;margin-top:4px;overflow:hidden}
#tr{float:right}
#vb{height:6px;background:#333;border-radius:3px;margin-top:12px;overflow:hidden}#vf{display:block;height:100%;width:0;background:#9ab}#md{font-size:12px;color:#9ab;margin-top:6px}
#toast{position:absolute;left:8%;right:8%;bottom:8px;background:#2f6fe4;color:#fff;text-align:center;padding:6px;border-radius:6px;font-size:14px;display:none}
#qb{position:absolute;left:0;right:0;top:30px;padding:10px;background:#111;display:none;z-index:5}
#qi{width:100%;font-size:20px;padding:8px;background:#222;color:#fff;border:1px solid #2f6fe4;-webkit-user-select:text}
#wheel{position:absolute;border-radius:50%;background:#f4f4f6;border:2px solid #b4b4ba}
#cb{position:absolute;left:31%;top:31%;width:38%;height:38%;border-radius:50%;background:#d2d2d7;border:2px solid #a6a6ac}
.lb{position:absolute;color:#555;font-size:15px;font-weight:bold}
</style></head><body>
<div id="top"><span id="clk"></span><span id="bt"><span id="pc"></span><span id="bi"><i id="bf"></i></span></span><span id="wfi"></span></div>
<div id="ipod">
<div id="scr">
  <div id="bar"><span id="title">iPod</span></div>
  <div id="list"></div>
  <div id="np"><div id="art">&#9835;</div><div id="nt"></div><div id="na"></div><div id="nb"></div>
    <div id="pb"><i id="pf"></i></div><div id="tm"><span id="tl">0:00</span><span id="tr">-0:00</span></div><div id="vb"><i id="vf"></i></div><div id="md"></div><div id="dlb">&#8595; Download</div></div>
  <div id="qb"><input id="qi" type="text" placeholder="Search..."><div id="sg"></div></div>
  <div id="toast"></div>
</div>
<div id="wheel"><div class="lb" style="top:6%;left:0;width:100%;text-align:center">MENU</div>
  <div class="lb" style="left:7%;top:46%">|&lt;&lt;</div><div class="lb" style="right:7%;top:46%">&gt;&gt;|</div>
  <div class="lb" style="bottom:6%;left:0;width:100%;text-align:center">&gt;||</div><div id="cb"></div></div>
</div>
<script>
// ES5 only (old WebView on Android 5.1). Avoid names that clash with window.* (top, scroll, ...)
var $=function(i){return document.getElementById(i)};
var S=[],lib=[],pls={},Q=[],cur=-1,st={p:0,d:0,pl:false,i:-1},ROWS=7,H=null,cbs={},cid=0,dls={},did=0,ttm=null,qmode='aud',npm='vol',shuf=false,rep=0,idle=null,dimmed=false,mqs=[],lastE=0,wasL=false;
try{var o=JSON.parse(localStorage.getItem('opt')||'{}');shuf=!!o.s;rep=o.r||0}catch(e){}
function optSave(){try{localStorage.setItem('opt',JSON.stringify({s:shuf,r:rep}))}catch(e){}}
function refresh(f){var k=cs().sel;S.pop();push(f());cs().sel=k;draw()}
function wake(){if(dimmed){A.dim(false);dimmed=false}clearTimeout(idle);idle=setTimeout(function(){A.dim(true);dimmed=true},25000)}
try{pls=JSON.parse(localStorage.getItem('pl')||'{}')}catch(e){}
function savePl(){try{localStorage.setItem('pl',JSON.stringify(pls))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+(s%60<10?'0':'')+s%60}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(ttm);ttm=setTimeout(function(){t.style.display='none'},2400)}
function cs(){return S[S.length-1]}
function push(sc){sc.sel=0;sc.off=0;S.push(sc);draw()}
function back(){if($('qb').style.display=='block'){$('qb').style.display='none';$('qi').blur();return}if(S.length>1){S.pop();draw()}}

// ---- drawing ----
function draw(){var s=cs();$('title').textContent=s.title;
 if(s.np){$('list').style.display='none';$('np').style.display='block';drawNP();return}
 $('np').style.display='none';$('list').style.display='block';
 var n=s.items.length,h='',i;
 if(s.sel<s.off)s.off=s.sel;if(s.sel>=s.off+ROWS)s.off=s.sel-ROWS+1;
 for(i=s.off;i<Math.min(n,s.off+ROWS);i++){var it=s.items[i];
  h+='<div class="r'+(i==s.sel?' sel':'')+'" data-i="'+i+'">'+(it.img?'<img class="th" src="'+it.img+'">':'')+'<div class="tt">'+esc(it.t)+'</div>'+(it.s!=null&&it.s!==''?'<span class="s">'+esc(it.s)+'</span>':'')+(it.dl?'<b class="dl" data-d="'+i+'">&#8595;</b>':'')+'</div>'}
 if(!n)h='<div class="r">'+esc(s.empty||'Empty')+'</div>';
 $('list').innerHTML=h;mqList([document.querySelector('.r.sel .tt')])}
function drawNP(){var t=Q[cur],im='';
 if(!t){$('nt').textContent='Not Playing';$('na').textContent='';$('nb').textContent='';$('dlb').style.display='none';$('art').style.backgroundImage='none';$('art').innerHTML='&#9835;';return}
 $('nt').textContent=t.t;$('na').textContent=t.a;$('nb').textContent=t.b+' · '+(t.p.indexOf('http')==0?'Online':src(t.p));$('dlb').style.display=t.p.indexOf('http')==0?'inline-block':'none';
 if(t.img)im=t.img;else{try{im=A.art(t.p)}catch(e){}}
 $('art').style.backgroundImage=im?'url('+im+')':'none';$('art').innerHTML=im?'':'&#9835;';mqList([$('nt'),$('na')])}

// ---- navigation ----
function mv(d){var s=cs();
 if(s.np){if(npm=='vol'){A.vol(d);poll()}else{st.p=Math.max(0,st.p+d*5000);A.seek(st.p)}return}
 var n=s.items.length;if(!n)return;s.sel=Math.max(0,Math.min(n-1,s.sel+d));draw()}
function sel(){var s=cs();if(s.np){npm=npm=='vol'?'seek':'vol';poll();return}var it=s.items[s.sel];if(it&&it.f)it.f(it)}
function ctx(){var s=cs();var it=s.items[s.sel];if(it&&s.ctx)s.ctx(it)}
// tap / swipe directly on the screen list
var ly=0,lmoved=0,lacc=0;
$('list').addEventListener('touchstart',function(e){ly=e.touches[0].clientY;lmoved=0;lacc=0},false);
$('list').addEventListener('touchmove',function(e){var y=e.touches[0].clientY;lacc+=ly-y;ly=y;lmoved+=Math.abs(lacc);
 while(lacc>=40){lacc-=40;mv(1)}while(lacc<=-40){lacc+=40;mv(-1)}e.preventDefault()},false);
$('list').addEventListener('click',function(e){if(lmoved>25)return;var n=e.target;
 if(n.getAttribute&&n.getAttribute('data-d')!=null){dlTrack(cs().items[parseInt(n.getAttribute('data-d'),10)].tr);return}
 while(n&&n!==this&&!n.getAttribute('data-i'))n=n.parentNode;
 if(n&&n.getAttribute&&n.getAttribute('data-i')!=null){cs().sel=parseInt(n.getAttribute('data-i'),10);draw();sel()}},false);
$('np').addEventListener('click',function(e){if(e.target.id=='dlb'){dlTrack(Q[cur]);return}A.toggle()},false);

// ---- screens ----
function src(p){return p.indexOf('/storage/')==0&&p.indexOf('/storage/emulated')!=0&&p.indexOf('/storage/self')!=0?'SD card':'Phone'}
function mqList(a){mqs=a.filter(Boolean).map(function(e){e.scrollLeft=0;return{e:e,p:0,d:1,w:12}})}
function clean(t){t.a=(!t.a||t.a=='<unknown>')?'Unknown':t.a;t.b=(!t.b||t.b=='<unknown>')?'Unknown':t.b;t.t=t.t||'Untitled';return t}
function mainMenu(){return{title:'iPod',items:[
 {t:'Now Playing',f:function(){if(cur>=0)push({title:'Now Playing',np:1});else toast('Nothing playing')}},
 {t:'Music',s:'>',f:function(){push(musicMenu())}},
 {t:'Playlists',s:'>',f:function(){push(plMenu())}},
 {t:'Online (Wi-Fi)',s:'>',f:function(){push(onlineMenu())}},
 {t:'Settings',s:'>',f:function(){push(setMenu())}},
 {t:'Exit',s:'x',f:function(){A.exit()}}]}}
function musicMenu(){return{title:'Music',items:[
 {t:'All Songs',s:lib.length,f:function(){push(songs(lib,'Songs',true))}},
 {t:'Artists',s:'>',f:artists},
 {t:'Where are my songs?',f:function(){toast('Audio files on phone + SD card, and your Music/iPod downloads')}},
 {t:'Shuffle All',f:function(){var l=lib.slice().sort(function(){return Math.random()-.5});if(l.length)play(l,0)}},
 {t:'Shuffle',s:shuf?'On':'Off',f:function(){shuf=!shuf;A.setShuffle(shuf);optSave();refresh(musicMenu)}},
 {t:'Repeat',s:['Off','All','One'][rep],f:function(){rep=(rep+1)%3;A.setRepeat(rep);optSave();refresh(musicMenu)}}]}}
function songs(list,title,addable,plname){return{title:title,empty:'No songs - copy MP3s or use Online',items:list.map(function(t,i){return{t:t.t,s:t.a,f:function(){play(list,i)},tr:t}}),
 ctx:function(it){if(plname){var k=pls[plname].indexOf(it.tr.p);if(k>=0){pls[plname].splice(k,1);savePl();toast('Removed');S.pop();push(songs(plTracks(plname),title,false,plname))}}
  else if(addable)push(actMenu(it.tr))}}}
function actMenu(tr){var it=[{t:'Add to playlist',f:function(){push(addMenu(tr))}}];
 if(tr.p.indexOf('/Music/iPod/')>=0)it.push({t:'Delete from phone',f:function(){push({title:'Delete?',items:[{t:'Yes, delete',f:function(){if(A.del(tr.p)){loadLib();S=[S[0]];push(musicMenu());toast('Deleted')}else toast('Cannot delete')}},{t:'Cancel',f:function(){S.pop();draw()}}]})}});
 return{title:tr.t,items:it}}
function artists(){var m={};lib.forEach(function(t){(m[t.a]=m[t.a]||[]).push(t)});
 push({title:'Artists',items:Object.keys(m).sort().map(function(n){return{t:n,s:m[n].length,f:function(){push(songs(m[n],n,true))}}})})}
function plTracks(n){return pls[n].map(function(p){for(var i=0;i<lib.length;i++)if(lib[i].p==p)return lib[i]}).filter(Boolean)}
function plMenu(){var items=Object.keys(pls).map(function(n){return{t:n,s:pls[n].length,f:function(){push(songs(plTracks(n),n,false,n))}}});
 items.push({t:'+ New Playlist',f:function(){var n='Playlist '+(Object.keys(pls).length+1);pls[n]=[];savePl();S.pop();push(plMenu())}});
 return{title:'Playlists',items:items}}
function addMenu(tr){var items=Object.keys(pls).map(function(n){return{t:n,f:function(){if(pls[n].indexOf(tr.p)<0)pls[n].push(tr.p);savePl();toast('Added to '+n);S.pop();S.pop();draw()}}});
 return{title:'Add to...',empty:'Create a playlist first',items:items,sel:0,off:0}}
function askQ(mode,ph){qmode=mode;$('qi').placeholder=ph;$('qb').style.display='block';$('qi').value='';$('qi').focus()}
function onlineMenu(){return{title:'Online',items:[
 {t:'Search Music',s:'Audius',f:function(){askQ('aud','Song or artist...')}},
 {t:'Search Podcasts',f:function(){askQ('pod','Podcast name...')}},
 {t:'Wi-Fi On/Off',f:function(){A.toggleWifi();toast('Toggling Wi-Fi...');setTimeout(upd,2500)}}]}}
function setMenu(){return{title:'Settings',items:[
 {t:'Wi-Fi On/Off',f:function(){A.toggleWifi();setTimeout(upd,2500)}},
 {t:'Rescan Library',f:function(){loadLib();toast(lib.length+' songs')}},
 {t:'Close background apps',f:function(){A.saveBattery()}},
 {t:'Sound test',f:function(){A.beep();toast('Beep? If silent, raise media volume')}}]}}

// ---- playback ----
function play(list,i){Q=list.slice();cur=i;A.playQueue(JSON.stringify(Q.map(function(t){return t.p})),i);
 if(!cs().np)push({title:'Now Playing',np:1});else drawNP()}
var pc=0;
function poll(){if(!cs().np&&(++pc%4))return;var s;try{s=JSON.parse(A.state())}catch(e){return}st=s;
 if(s.e>lastE){lastE=s.e;toast(s.m||'Playback error')}if(s.l&&!wasL)toast('Loading...');wasL=!!s.l;
 if(s.i>=0&&s.i!=cur&&Q[s.i]){cur=s.i;if(cs().np)drawNP()}
 if(cs().np){var d=s.d||(Q[cur]?Q[cur].d*1000:0);
  $('pf').style.width=(d?Math.min(100,s.p*100/d):0)+'%';$('tl').textContent=fmt(s.p/1000);$('tr').textContent='-'+fmt((d-s.p)/1000);
  try{var v=A.volume().split(',');$('vf').style.width=(v[0]*100/v[1])+'%'}catch(e){}
  $('md').textContent=(npm=='vol'?'Wheel: Volume (center = scrub)':'Wheel: Scrub (center = volume)')+(s.s?' | Shuffle':'')+(s.r==1?' | Repeat all':s.r==2?' | Repeat one':'')}}

// ---- online: Audius music + podcasts ----
function get(u,f){cbs[++cid]=f;A.get(u,cid)}
function onHttp(id,ok,b){var f=cbs[id];delete cbs[id];if(f)f(ok?b:null)}
function onDl(id,p,path){var t=dls[id];if(!t)return;
 if(p==-1){toast('Download failed');delete dls[id]}
 else if(p==101){lib.push(clean({p:path,t:t.t,a:t.a,b:'Downloads',d:t.d}));toast('Saved: '+t.t);delete dls[id]}
 else toast('Downloading '+p+'%')}
function trackScreen(T,title){return{title:title,empty:'No results',items:T.map(function(t,i){return{t:t.t,s:t.a,f:function(){play(T,i)},tr:t,dl:1,img:t.img}}),
 ctx:function(it){dlTrack(it.tr)}}}
function dlTrack(t){if(!t||t.p.indexOf('http')!=0){toast('Already on phone');return}var id=++did;dls[id]=t;toast('Downloading...');A.download(t.p,t.t+' - '+t.a,id,t.img||'')}
function host(f){if(H)return f(H);get('https://api.audius.co',function(r){try{H=JSON.parse(r).data[0]}catch(e){H='https://discoveryprovider.audius.co'}f(H)})}
function byPop(a,b){return(b.play_count||0)-(a.play_count||0)}
function audSearch(q,fixed){toast('Searching...');host(function(h){
 get(h+'/v1/tracks/search?query='+encodeURIComponent(q)+'&limit=25&app_name=IPODCLASSIC',function(r){
  var d;try{d=JSON.parse(r).data}catch(e){}if(!d){toast('Search failed - check Wi-Fi');return}
  if(!d.length){if(fixed){toast('No results');return}
   get('https://itunes.apple.com/search?media=music&entity=song&limit=1&term='+encodeURIComponent(q),function(r2){
    try{var x=JSON.parse(r2).results[0];if(x){toast('Showing results for: '+x.trackName);audSearch(x.trackName+' '+x.artistName,true);return}}catch(e){}toast('No results')});return}
  d.sort(byPop);
  var T=d.map(function(x){return{p:h+'/v1/tracks/'+x.id+'/stream?app_name=IPODCLASSIC',t:x.title,a:x.user?x.user.name:'',b:'Audius',d:x.duration||0,img:x.artwork?x.artwork['150x150']:''}});
  push(trackScreen(T,'Top results'));toast('Most popular first. Tap = play, arrow = download')})})}
var sgt=null,sgq=[];
function suggest(q){var out=function(it){sgq=it.map(function(x){return x.q});$('sg').innerHTML=it.map(function(x,i){return'<div class="g" data-k="'+i+'">'+(x.img?'<img class="th" src="'+x.img+'">':'')+'<div class="tt">'+esc(x.t)+'</div></div>'}).join('')};
 if(qmode=='pod'){get('https://itunes.apple.com/search?media=podcast&limit=5&term='+encodeURIComponent(q),function(r){try{out(JSON.parse(r).results.map(function(x){return{t:x.collectionName,q:x.collectionName,img:x.artworkUrl60}}))}catch(e){}});return}
 host(function(h){get(h+'/v1/tracks/search?query='+encodeURIComponent(q)+'&limit=10&app_name=IPODCLASSIC',function(r){try{out(JSON.parse(r).data.sort(byPop).slice(0,5).map(function(x){return{t:x.title+' - '+(x.user?x.user.name:''),q:x.title,img:x.artwork?x.artwork['150x150']:''}}))}catch(e){}})})}
function doSearch(q){$('sg').innerHTML='';if(qmode=='pod')podSearch(q);else audSearch(q)}
$('qi').oninput=function(){clearTimeout(sgt);var q=this.value.replace(/^\s+|\s+$/g,'');if(q.length<2){$('sg').innerHTML='';return}sgt=setTimeout(function(){suggest(q)},450)};
$('sg').addEventListener('click',function(e){var n=e.target;while(n&&n!==this&&!(n.getAttribute&&n.getAttribute('data-k')!=null))n=n.parentNode;
 if(n&&n.getAttribute&&n.getAttribute('data-k')!=null){$('qb').style.display='none';$('qi').blur();doSearch(sgq[parseInt(n.getAttribute('data-k'),10)])}},false);
function podSearch(q){toast('Searching...');
 get('https://itunes.apple.com/search?media=podcast&limit=20&term='+encodeURIComponent(q),function(r){
  var d;try{d=JSON.parse(r).results}catch(e){}if(!d||!d.length){toast('No results - check Wi-Fi');return}
  push({title:'Podcasts',items:d.filter(function(x){return x.feedUrl}).map(function(x){return{t:x.collectionName,s:x.artistName,img:x.artworkUrl60,f:function(){episodes(x)}}})})})}
function episodes(x){toast('Loading episodes...');get(x.feedUrl,function(r){if(!r){toast('Feed failed');return}
 var parts=r.split('<item'),T=[],i;
 for(i=1;i<parts.length&&T.length<30;i++){var p=parts[i],u=/<enclosure[^>]*url=["']([^"']+)["']/.exec(p),t=/<title>(?:<!\[CDATA\[)?([\s\S]*?)(?:\]\]>)?<\/title>/.exec(p);
  if(u)T.push({p:u[1].replace(/&amp;/g,'&'),t:t?t[1].trim():'Episode',a:x.collectionName,b:'Podcast',d:0,img:x.artworkUrl100})}
 if(!T.length){toast('No episodes');return}push(trackScreen(T,'Episodes'));toast('Tap = play, hold center = download')})}
$('qi').onkeydown=function(e){if(e.keyCode==13){var q=this.value;this.blur();$('qb').style.display='none';if(q)doSearch(q)}};

// ---- click wheel ----
var W=$('wheel'),ang=0,acc=0,moved=0,tid=null,lng=0,zone=false;
function pt(e){var t=(e.touches&&e.touches[0])||e.changedTouches[0],r=W.getBoundingClientRect(),
 x=t.clientX-(r.left+r.width/2),y=t.clientY-(r.top+r.height/2);
 return{d:Math.sqrt(x*x+y*y),a:Math.atan2(y,x)*180/Math.PI,R:r.width/2}}
W.addEventListener('touchstart',function(e){e.preventDefault();var p=pt(e);zone=p.d<p.R*0.38;ang=p.a;acc=0;moved=0;lng=0;
 if(zone)tid=setTimeout(function(){lng=1;ctx()},600)},false);
W.addEventListener('touchmove',function(e){e.preventDefault();if(zone)return;var p=pt(e),d=p.a-ang;
 if(d>180)d-=360;if(d<-180)d+=360;ang=p.a;acc+=d;moved+=Math.abs(d);
 var step=cs().np?14:24;
 while(acc>=step){acc-=step;mv(1)}while(acc<=-step){acc+=step;mv(-1)}},false);
W.addEventListener('touchend',function(e){e.preventDefault();clearTimeout(tid);
 if(zone){if(!lng)sel();return}
 if(moved<12){var a=ang;
  if(a>-135&&a<-45)back();else if(a>=-45&&a<=45)A.next();else if(a>45&&a<135)A.toggle();else A.prev()}},false);

// ---- status & init ----
function upd(){var d=new Date();$('clk').textContent=d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();
